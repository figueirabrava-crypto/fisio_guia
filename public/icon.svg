<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle glow circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- Brain Silhouette Anatomy (Stylized Medical) -->
  <g transform="translate(136, 120) scale(0.47)" fill="none" stroke="url(#brainGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Hemisphere -->
    <path d="M 240,80 C 180,70 120,110 110,170 C 80,180 70,240 100,280 C 70,320 80,380 130,410 C 170,440 230,420 240,380" />
    <path d="M 170,170 C 190,200 230,190 240,230 C 210,260 170,240 150,290" />
    <path d="M 120,270 C 160,280 180,320 240,320" />
    
    <!-- Right Hemisphere -->
    <path d="M 272,80 C 332,70 392,110 402,170 C 432,180 442,240 412,280 C 442,320 432,380 382,410 C 342,440 282,420 272,380" />
    <path d="M 342,170 C 322,200 282,190 272,230 C 302,260 342,240 362,290" />
    <path d="M 392,270 C 352,280 332,320 272,320" />
  </g>

  <!-- ECG Heartbeat Line crossing across -->
  <path d="M 60,340 L 170,340 L 195,310 L 220,385 L 255,225 L 290,420 L 320,320 L 345,355 L 365,340 L 452,340" 
        fill="none" 
        stroke="url(#ecgGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Small text banner "FISIOGUIA" -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="4">
    FISIOGUIA
  </text>
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#38bdf8" letter-spacing="2">
    FISIOLOGIA HUMANA
  </text>
</svg>
